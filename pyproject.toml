[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-analysis"
version = "0.1.0"
description = "Video-based traffic analysis with hexagonal architecture"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0",
    "supervision>=0.25",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyQt6>=6.6",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
